<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Swift Vendor - Shop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="450" cy="80" r="25" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="70" cy="420" r="35" fill="#FFFFFF" opacity="0.08"/>
  <!-- Shopping bag body -->
  <path d="M160 200 L160 280 Q160 340 200 360 L312 360 Q352 340 352 280 L352 200 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Bag handles -->
  <path d="M200 200 Q200 120 256 120 Q312 120 312 200" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Interior details -->
  <ellipse cx="256" cy="230" rx="50" ry="15" fill="#2563EB" opacity="0.4"/>
  <path d="M220 270 L292 270" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
  <path d="M215 310 L297 310" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.5"/>
</svg>
