<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Swift Admin - Control</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- Decorative accents -->
  <circle cx="80" cy="100" r="28" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="420" cy="400" r="35" fill="#FFFFFF" opacity="0.08"/>
  <!-- Central dashboard -->
  <rect x="140" y="140" width="232" height="232" rx="20" fill="#FFFFFF" opacity="0.08"/>
  <!-- Center control button -->
  <circle cx="256" cy="256" r="40" fill="#FFFFFF" filter="url(#blur)"/>
  <circle cx="256" cy="256" r="32" fill="#9333EA"/>
  <!-- Control points -->
  <circle cx="256" cy="160" r="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
  <circle cx="352" cy="256" r="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="352" r="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
  <circle cx="160" cy="256" r="28" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" opacity="0.9"/>
  <!-- Connection lines -->
  <line x1="256" y1="195" x2="256" y2="225" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="315" y1="256" x2="285" y2="256" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="256" y1="317" x2="256" y2="287" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <line x1="197" y1="256" x2="227" y2="256" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  <!-- Inner dividers -->
  <path d="M200 200 L312 312" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
  <path d="M312 200 L200 312" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
</svg>
