name: Campus Food Delivery Pipeline

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Node.js Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json
      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci
      - name: Run Tests & Coverage
        working-directory: ./backend
        run: npm test -- --coverage
      - name: Run Contract + Performance Budget Suites
        working-directory: ./backend
        run: |
          npm test -- tests/api/contracts_compliance.test.ts --runInBand
          npm test -- tests/api/performance_budgets.test.ts --runInBand

  user-app-tests:
    name: User App (Flutter) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dependencies
        working-directory: ./user_app
        run: flutter pub get
      - name: Enforce runtime API config
        working-directory: ./user_app
        run: |
          if grep -R -n "baseUrl: 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected."
            exit 1
          fi
          if grep -R -n "_dio.options.baseUrl = 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected."
            exit 1
          fi
          if grep -R -n "const _baseUrl = 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded _baseUrl detected."
            exit 1
          fi
      - name: Analyze
        working-directory: ./user_app
        run: flutter analyze
      - name: Run Tests
        working-directory: ./user_app
        run: flutter test --coverage

  vendor-app-tests:
    name: Vendor App (Flutter) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dependencies
        working-directory: ./vendor_app
        run: flutter pub get
      - name: Enforce runtime API config
        working-directory: ./vendor_app
        run: |
          if grep -R -n "baseUrl: 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected."
            exit 1
          fi
          if grep -R -n "_dio.options.baseUrl = 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected."
            exit 1
          fi
          if grep -R -n "const _baseUrl = 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded _baseUrl detected."
            exit 1
          fi
      - name: Analyze
        working-directory: ./vendor_app
        run: flutter analyze
      - name: Run Tests
        working-directory: ./vendor_app
        run: flutter test --coverage

  admin-app-tests:
    name: Admin App (Flutter) Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Dependencies
        working-directory: ./admin_app
        run: flutter pub get
      - name: Enforce runtime API config
        working-directory: ./admin_app
        run: |
          if grep -R -n "baseUrl: 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected."
            exit 1
          fi
          if grep -R -n "_dio.options.baseUrl = 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected."
            exit 1
          fi
          if grep -R -n "const _baseUrl = 'https://swift-campus.vercel.app/api/v1'" lib; then
            echo "Hardcoded _baseUrl detected."
            exit 1
          fi
      - name: Analyze
        working-directory: ./admin_app
        run: flutter analyze
      - name: Run Widget Tests
        working-directory: ./admin_app
        run: flutter test --coverage
