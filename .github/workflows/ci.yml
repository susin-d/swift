name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — Jest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-key' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'placeholder-razorpay-id' }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || 'placeholder-razorpay-secret' }}

      - name: Run contract compliance suite
        run: npm test -- tests/api/contracts_compliance.test.ts --runInBand
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-key' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Run performance budget suite
        run: npm test -- tests/api/performance_budgets.test.ts --runInBand
        env:
          NODE_ENV: test
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-key' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  user_app:
    name: User App — Flutter Analyze + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: user_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce runtime API config (no hardcoded base URL assignment)
        run: |
          if grep -R -nE "baseUrl:\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected. Use String.fromEnvironment('API_BASE_URL')."
            exit 1
          fi
          if grep -R -nE "_dio.options.baseUrl\\s*=\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected. Use runtime config."
            exit 1
          fi
          if grep -R -nE "const _baseUrl\\s*=\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded _baseUrl detected. Use String.fromEnvironment('API_BASE_URL')."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

  vendor_app:
    name: Vendor App — Flutter Analyze + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce runtime API config (no hardcoded base URL assignment)
        run: |
          if grep -R -nE "baseUrl:\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected. Use String.fromEnvironment('API_BASE_URL')."
            exit 1
          fi
          if grep -R -nE "_dio.options.baseUrl\\s*=\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected. Use runtime config."
            exit 1
          fi
          if grep -R -nE "const _baseUrl\\s*=\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded _baseUrl detected. Use String.fromEnvironment('API_BASE_URL')."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage

  admin_app:
    name: Admin App — Flutter Analyze + Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enforce runtime API config (no hardcoded base URL assignment)
        run: |
          if grep -R -nE "baseUrl:\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected. Use String.fromEnvironment('API_BASE_URL')."
            exit 1
          fi
          if grep -R -nE "_dio.options.baseUrl\\s*=\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded API base URL assignment detected. Use runtime config."
            exit 1
          fi
          if grep -R -nE "const _baseUrl\\s*=\\s*'https?://.*/api/v1'" lib; then
            echo "Hardcoded _baseUrl detected. Use String.fromEnvironment('API_BASE_URL')."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --coverage
